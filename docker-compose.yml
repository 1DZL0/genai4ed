# The whole platform, in three containers.
#
#   docker compose up -d db     database only - what you want while developing
#   docker compose up -d        everything - what someone else runs to try it
#
# A recipient needs Docker and nothing else: no Python, no Node, no Postgres.
services:
  db:
    image: postgres:18
    container_name: genai4ed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: genai4ed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genai4ed}
      POSTGRES_DB: genai4ed
    # 5433 on the host: 5432 may belong to a Postgres already on the machine.
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql and places the
      # cluster in a major-version subdirectory itself. The .../data form that
      # pre-18 examples show makes the container refuse to start.
      - genai4ed-pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai4ed -d genai4ed"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: genai4ed-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is `db` on its own port 5432.
      DATABASE_URL: postgresql+asyncpg://genai4ed:${POSTGRES_PASSWORD:-genai4ed}@db:5432/genai4ed
      # The class agent's model, through OpenRouter. With no key the scripted
      # demo agent answers instead, so everything still runs.
      AGENT_CLIENT: ${AGENT_CLIENT:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
      OPENROUTER_TIMEOUT_S: ${OPENROUTER_TIMEOUT_S:-60}
      STUDY_ACTIVE: ${STUDY_ACTIVE:-false}
      STUDY_SEED: ${STUDY_SEED:-genai4ed}
      STUDY_POLICY: ${STUDY_POLICY:-ladder}
      STUDY_SUPERVISOR: ${STUDY_SUPERVISOR:-true}
      SUPERVISOR_ENFORCE: ${SUPERVISOR_ENFORCE:-true}
      RESEARCH_KEY: ${RESEARCH_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # On for now: any username and password sign in, for trying the platform.
      # Set DEMO_SIGN_IN=false for real accounts (email/password, join codes).
      DEMO_SIGN_IN: ${DEMO_SIGN_IN:-true}
      # Keys the students' join codes; changing it invalidates every issued code.
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    container_name: genai4ed-web
    restart: unless-stopped
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  genai4ed-pgdata:
